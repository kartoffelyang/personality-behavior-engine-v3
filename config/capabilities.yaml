navigation:
  display_name: 导航
  domain: 导航
  description: 覆盖地点搜索、详情查看、历史目的地、目的地设置、路线规划/比较/选择、导航运行和 ETA/迟到风险判断。
  atomic_abilities:
    - name: 地点搜索
      definition: 搜索明确目的地
      core_params: [名称, 地址, 范围]
      service_sources: [高德地图等]
    - name: 地点详情查看
      definition: 获取目的地信息
      core_params: [地址, 坐标, 入口]
      service_sources: [高德地图等]
    - name: 历史目的地获取
      definition: 读取历史或收藏地点
      core_params: [用户, 时间, 地点类型]
      service_sources: [导航系统, 用户记忆]
    - name: 目的地设置
      definition: 设置或更换目的地
      core_params: [POI, 坐标, 入口]
      service_sources: [导航系统]
    - name: 路线规划
      definition: 生成候选路线
      core_params: [起终点, 路况, 偏好]
      service_sources: [高德地图等]
    - name: 路线比较
      definition: 比较路线差异
      core_params: [时间, 距离, 收费, 拥堵]
      service_sources: [导航系统]
    - name: 路线选择
      definition: 确定执行路线
      core_params: [路线, 选择依据]
      service_sources: [系统决策, 用户选择]
    - name: 导航运行控制
      definition: 控制导航状态
      core_params: [开始, 暂停, 继续, 结束]
      service_sources: [导航系统]
    - name: 路线重新规划
      definition: 根据变化更新路线
      core_params: [当前位置, 路况, 新约束]
      service_sources: [导航系统]
    - name: 途经点管理
      definition: 管理路线途经点
      core_params: [地点, 顺序, 停留要求]
      service_sources: [导航系统]
    - name: 预计到达时间获取
      definition: 获取预计到达时间
      core_params: [路线, 路况, 更新时间]
      service_sources: [导航系统]
    - name: 迟到风险判断
      definition: 判断能否按时到达
      core_params: [到达时间, 任务时间, 缓冲时间]
      service_sources: [规划模块, 日程系统]
  recommended_execution_modes: [auto_generate, choose_execute, auto_execute, confirm_execute, suggest_only]
  return_fields:
    - recommended_destination
    - eta_minutes
    - started
  supported_needs:
    task_completion: 1.0
    time_efficiency: 0.95
    trip_forecast: 0.8
    safety_support: 0.85
    emotional_comfort: 0.1
    dependency_check: 0.6
  function_affinity:
    Te: 0.95
    Si: 0.65
    Ni: 0.55
    Ti: 0.55
    Se: 0.4
    Ne: 0.35
    Fe: 0.2
    Fi: 0.15
  properties:
    risk: 0.15
    intrusiveness: 0.35
    reversibility: 0.9
    requires_confirmation: false
    max_persona_randomness: 0.05
  history_keys:
    - preferred_route_style
  permission_key: allow_auto_navigation
  parameter_presets:
    low:
      mode: suggest_only
    medium:
      mode: start_known_destination
    high:
      mode: fastest_stable

