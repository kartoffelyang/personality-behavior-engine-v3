climate:
  display_name: 空调
  domain: 空调
  description: 覆盖空调开关、温度、风量、出风模式、净化、除雾和历史空调设置恢复。
  atomic_abilities:
    - name: 空调开关
      definition: 开启或关闭空调
      core_params: [开关, 作用区域]
      service_sources: [车控系统]
    - name: 温度调节
      definition: 设置车内温度
      core_params: [温度, 区域]
      parameter_schema:
        温度: {type: number}
        区域: {type: string}
      service_sources: [车控系统]
    - name: 风量调节
      definition: 调整送风强度
      core_params: [档位, 区域]
      service_sources: [车控系统]
    - name: 出风模式切换
      definition: 切换出风位置
      core_params: [吹脸, 吹脚, 吹窗]
      service_sources: [车控系统]
    - name: 空气净化开关
      definition: 控制空气净化
      core_params: [开关, 净化模式]
      service_sources: [车控系统]
    - name: 前挡除雾开关
      definition: 控制前挡除雾
      core_params: [开关, 强度, 时长]
      service_sources: [车控系统]
    - name: 后挡除雾开关
      definition: 控制后挡除雾
      core_params: [开关, 时长]
      service_sources: [车控系统]
    - name: 空调设置恢复
      definition: 恢复历史设置
      core_params: [用户, 温度, 模式]
      parameter_schema:
        温度: {type: number}
      service_sources: [车控系统, 用户记忆]
  recommended_execution_modes: [conditional_auto, auto_execute, confirm_execute, suggest_only]
  return_fields:
    - current_state
    - success
    - target_temperature
  supported_needs:
    physical_comfort: 1.0
    emotional_comfort: 0.35
    task_completion: 0.25
    restore_history: 0.7
    time_efficiency: 0.3
    group_balance: 0.75
    user_autonomy: 0.55
  function_affinity:
    Se: 0.8
    Si: 0.75
    Te: 0.55
    Fe: 0.5
    Fi: 0.4
    Ti: 0.35
    Ne: 0.25
    Ni: 0.3
  properties:
    risk: 0.05
    intrusiveness: 0.3
    reversibility: 1.0
    requires_confirmation: false
    max_persona_randomness: 0.08
  history_keys:
    - preferred_temperature
  permission_key: allow_auto_climate
  parameter_presets:
    low:
      target_delta: -1
      mode: gentle
    medium:
      target_delta: -2
      mode: balanced
    high:
      target_delta: -3
      mode: rapid

