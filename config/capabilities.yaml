ecosystem:
  display_name: 生态服务
  domain: 生态服务
  description: 覆盖服务与地点搜索、详情获取、候选筛选与比较、价格优惠、资源状态、方案选择、预约、订单、支付和进度查询。
  atomic_abilities:
    - name: 服务与地点搜索
      definition: 搜索餐厅、酒店、景点、停车场等
      core_params: [类型, 关键词, 位置, 范围]
      service_sources: [高德, 大众点评, 美团, ETCP]
    - name: 服务详情获取
      definition: 获取商户或服务详情
      core_params: [地址, 营业时间, 评分, 设施]
      service_sources: [高德, 大众点评, 美团]
    - name: 候选服务筛选
      definition: 按需求过滤候选服务
      core_params: [距离, 绕行, 评分, 价格]
      service_sources: [高德, 大众点评, 停车平台]
    - name: 候选方案比较
      definition: 比较候选服务差异
      core_params: [距离, 时间, 价格, 评价, 状态]
      service_sources: [规划模块, 服务App]
    - name: 价格与优惠查询
      definition: 查询价格、优惠和收费规则
      core_params: [原价, 优惠价, 团购, 预计费用]
      service_sources: [大众点评, 美团, 停车平台]
    - name: 实时资源状态查询
      definition: 查询选择前的资源状态
      core_params: [车位, 排队人数, 营业状态]
      service_sources: [ETCP, PP停车, 美团]
    - name: 候选方案选择
      definition: 确定最终服务方案
      core_params: [候选项, 选择依据, 选择方式]
      service_sources: [系统决策, 用户选择]
    - name: 预约与排队管理
      definition: 创建、修改或取消预约排队
      core_params: [时间, 人数, 联系方式]
      service_sources: [大众点评, 美团, 服务商App]
    - name: 订单管理
      definition: 创建、查询或取消订单
      core_params: [项目, 数量, 状态, 取消条件]
      service_sources: [大众点评, 美团, 停车平台]
    - name: 支付与缴费
      definition: 完成买单、票务或停车缴费
      core_params: [金额, 支付方式, 优惠, 确认]
      service_sources: [美团, 大众点评, ETCP]
    - name: 服务进度查询
      definition: 查询服务执行状态
      core_params: [排队位置, 订单进度, 停车时长]
      service_sources: [美团, 停车平台等]
  recommended_execution_modes: [auto_generate, choose_execute, confirm_execute, suggest_only]
  return_fields:
    - ecosystem_type
    - recommendations
    - eta_or_score_or_delivery
    - call_result
  supported_needs:
    trip_forecast: 0.75
    provide_options: 0.9
    exploration: 0.8
    task_completion: 0.55
    time_efficiency: 0.5
    safety_support: 0.6
    group_balance: 0.4
    emotional_comfort: 0.25
  function_affinity:
    Ne: 0.9
    Ni: 0.7
    Te: 0.55
    Fe: 0.45
    Se: 0.4
    Si: 0.35
    Ti: 0.4
    Fi: 0.3
  properties:
    risk: 0.2
    intrusiveness: 0.4
    reversibility: 0.85
    requires_confirmation: true
    max_persona_randomness: 0.1
  history_keys: []
  permission_key: allow_auto_ecosystem
  parameter_presets:
    low:
      ecosystem_type: nearby_poi
      count: 2
    medium:
      ecosystem_type: route_assist
      count: 3
    high:
      ecosystem_type: life_service
      count: 3
